<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Actualités – Centre Japonais de Kinshasa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="images/logoc.png" type="image/png">
  <link rel="stylesheet" href="font-awesome.min.css">
  <link rel="stylesheet" href="cjk.css">
  <link rel="stylesheet" href="actualites.css">
</head>
<body class="page-news" data-page="actualites">
  <header class="topbar topbar--solid">
    <div class="brand-mark"><img src="images/logoc.png" alt="Logo du Centre Japonais de Kinshasa"></div>
    <a href="index.html" class="back" data-i18n="page.back" data-lang="fr">Retour à l'accueil</a>
    <nav class="topbar__nav" aria-label="Menu principal">
      <a href="actualites.html" class="is-active" data-i18n="nav.news" data-lang="fr">Actualités</a>
      <a href="formations.html" data-i18n="nav.formations" data-lang="fr">Formations</a>
      <a href="histoire.html" data-i18n="nav.history" data-lang="fr">Histoire du centre</a>
      <a href="a-propos.html" data-i18n="nav.about" data-lang="fr">À propos</a>
      <a href="activites.html" data-i18n="nav.activities" data-lang="fr">Activités</a>
      <a href="contact.html" data-i18n="nav.contact" data-lang="fr">Contactez-nous</a>
    </nav>
    <div class="lang-switcher" data-lang="fr">
      <button type="button" class="lang-switcher__trigger" aria-haspopup="dialog" aria-expanded="false">
        <span class="lang-switcher__flag" aria-hidden="true">🌐</span>
        <span class="lang-switcher__code" id="langTriggerCode">FR</span>
        <span class="lang-switcher__caret" aria-hidden="true">▾</span>
      </button>
      <div class="lang-switcher__panel" id="langSwitchPanel" role="dialog" aria-modal="false" aria-label="Sélecteur de langue">
        <label class="lang-switcher__search" for="langSearch">
          <span aria-hidden="true">⌕</span>
          <input id="langSearch" type="search" placeholder="Rechercher une langue" autocomplete="off">
        </label>
        <div class="lang-switcher__list" id="langSwitchList"></div>
      </div>
    </div>
  </header>

  <main>
    <section class="news-hero">
      <div class="news-hero__content wrap">
        <p class="news-hero__eyebrow" data-translate="news.hero.kicker">Actualités</p>
        <h1 data-translate="news.hero.title">Actualités &amp; Événements</h1>
        <p class="news-hero__text" data-translate="news.hero.text">Suivez les ateliers, les festivals, les cours et les annonces du Centre Japonais de Kinshasa.</p>
      </div>
    </section>

    <section class="news-toolbar wrap" aria-label="Recherche et filtres des actualités">
      <div class="news-search">
        <label class="news-search__label" for="newsSearch" aria-label="Rechercher une actualité">
          <span aria-hidden="true">⌕</span>
          <input id="newsSearch" type="search" data-i18n-placeholder="news.search.placeholder" placeholder="Rechercher une actualité..." autocomplete="off">
        </label>
      </div>

      <div class="news-filters" id="newsFilters" aria-label="Filtres par catégorie">
        <button type="button" class="news-filter is-active" data-filter="all" data-translate="news.filter.all">Tous</button>
        <button type="button" class="news-filter" data-filter="samedi-nippon" data-translate="news.filter.samedi_nippon">Samedi Nippon</button>
        <button type="button" class="news-filter" data-filter="arts-martiaux" data-translate="news.filter.arts-martiaux">Arts martiaux</button>
        <button type="button" class="news-filter" data-filter="langue-japonaise" data-translate="news.filter.langue_japonaise">Langue Japonaise</button>
      </div>
    </section>

    <section class="wrap">
      <div class="news-grid" id="newsGrid" aria-live="polite"></div>
    </section>
  </main>

  <footer class="contact" id="contact">
    <div class="contact__grid">
      <div>
        <h2 data-i18n="contact.title" data-lang="fr">Contact</h2>
        <div id="contactDetails"></div>
      </div>
      <div class="contact__map" id="contactMap"></div>
    </div>
    <p class="contact__copy">© Centre Japonais de Kinshasa · CJK</p>
  </footer>

  <script src="data.js"></script>
  <script src="cjk.js"></script>
  <script src="actualites.js"></script>
</body>
</html>
